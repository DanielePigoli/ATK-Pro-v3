name: Smoke Windows Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the installer to test
        required: true
        default: v3.0.0-rc4
        type: string
      sha256:
        description: Expected SHA-256 of the installer asset
        required: true
        default: eb57b2dc933dc106db79352d3e9f89f3b451ee902f28dd1ebe5b23311eef57cf
        type: string
      portable_sha256:
        description: Expected SHA-256 of the portable ZIP asset
        required: true
        default: 204333d2aeab38d67ad937fd54cd2a4c83aa7b220275594f2ea7c695357acb33
        type: string
      disclaimer_revision:
        description: Legal disclaimer revision accepted by the silent installer
        required: true
        default: v3.0.0-legal-disclaimer-2026-08-02
        type: string
      build_run_id:
        description: Optional Build Windows Installer run ID (uses artifacts instead of release assets)
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  smoke-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TARGET_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
      DISCLAIMER_REVISION: ${{ inputs.disclaimer_revision }}

    steps:
      - name: Download and verify release installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'ATK-Pro-installer-smoke'
          $installerPath = Join-Path $smokeRoot 'ATK-Pro-Setup.exe'
          $installDir = Join-Path $smokeRoot 'installed'
          $installLog = Join-Path $smokeRoot 'install.log'
          $uninstallLog = Join-Path $smokeRoot 'uninstall.log'
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          @(
            "INSTALLER_PATH=$installerPath"
            "INSTALL_DIR=$installDir"
            "INSTALL_LOG=$installLog"
            "UNINSTALL_LOG=$uninstallLog"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

          $assetName = "ATK-Pro-Setup-$($env:TARGET_TAG).exe"
          $downloadPath = Join-Path $smokeRoot $assetName
          if ($env:BUILD_RUN_ID) {
            $artifactDir = Join-Path $smokeRoot 'installer-artifact'
            gh run download $env:BUILD_RUN_ID `
              --repo $env:GITHUB_REPOSITORY `
              --name 'ATK-Pro-Windows-installer' `
              --dir $artifactDir
            if ($LASTEXITCODE -ne 0) { throw "Build artifact download failed" }
            Move-Item -LiteralPath (Join-Path $artifactDir $assetName) -Destination $downloadPath
          }
          else {
            $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
            $release = $releases | Where-Object { $_.tag_name -eq $env:TARGET_TAG } | Select-Object -First 1
            if (-not $release) { throw "Release not found: $env:TARGET_TAG" }
            $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
            if (-not $asset) { throw "Release asset not found: $assetName" }
            curl.exe --location --fail-with-body --retry 3 --retry-all-errors `
              --header "Accept: application/octet-stream" `
              --header "Authorization: Bearer $env:GH_TOKEN" `
              --output $downloadPath `
              $asset.url
            if ($LASTEXITCODE -ne 0) { throw "Asset download failed: $assetName" }
          }
          Move-Item -LiteralPath $downloadPath -Destination $installerPath

          $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = $env:EXPECTED_SHA256.Trim().ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Installer SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }
          Write-Host "Verified installer SHA-256: $actualHash"

      - name: Assert clean runner and install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $productKey = 'HKLM:\Software\ATK-Pro'
          $uninstallKeys = @(
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8C7A9D5E-2A1B-3C4D-4E5E-8D3A2B1C4F9E}_is1',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{8C7A9D5E-2A1B-3C4D-4E5E-8D3A2B1C4F9E}_is1'
          )
          if ((Test-Path -LiteralPath $productKey) -or ($uninstallKeys | Where-Object { Test-Path -LiteralPath $_ })) {
            throw 'The hosted runner is not clean: an ATK-Pro installation is already registered.'
          }

          $installerArgs = @(
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            '/SP-'
            '/LANG=it'
            "/ATKACCEPTDISCLAIMER=$env:DISCLAIMER_REVISION"
            "/DIR=`"$env:INSTALL_DIR`""
            "/LOG=`"$env:INSTALL_LOG`""
          )
          $installerProcess = Start-Process -FilePath $env:INSTALLER_PATH -ArgumentList $installerArgs -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "Installer exited with code $($installerProcess.ExitCode)"
          }

          $app = Join-Path $env:INSTALL_DIR 'ATK-Pro.exe'
          $uninstaller = Join-Path $env:INSTALL_DIR 'unins000.exe'
          if (-not (Test-Path -LiteralPath $app)) { throw "Missing installed executable: $app" }
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "Missing uninstaller: $uninstaller" }

          $registration = Get-ItemProperty -LiteralPath $productKey
          $expectedVersion = $env:TARGET_TAG -replace '^v', ''
          if ($registration.Version -ne $expectedVersion) {
            throw "Unexpected registered version: $($registration.Version)"
          }
          if ([IO.Path]::GetFullPath($registration.InstallDir) -ne [IO.Path]::GetFullPath($env:INSTALL_DIR)) {
            throw "Unexpected registered install directory: $($registration.InstallDir)"
          }
          Write-Host "Installed ATK-Pro $($registration.Version) in $($registration.InstallDir)"

      - name: Launch installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:ATKPRO_ENV = 'production'
          $app = Join-Path $env:INSTALL_DIR 'ATK-Pro.exe'
          $process = Start-Process -FilePath $app -PassThru
          try {
            Start-Sleep -Seconds 20
            $process.Refresh()
            if ($process.HasExited) {
              throw "Installed application exited early with code $($process.ExitCode)"
            }
            Write-Host "Installed application remained running for 20 seconds (PID $($process.Id))."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Uninstall and verify cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uninstaller = Join-Path $env:INSTALL_DIR 'unins000.exe'
          $uninstallerArgs = @(
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            "/LOG=`"$env:UNINSTALL_LOG`""
          )
          $uninstallerProcess = Start-Process -FilePath $uninstaller -ArgumentList $uninstallerArgs -Wait -PassThru
          if ($uninstallerProcess.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstallerProcess.ExitCode)"
          }

          Start-Sleep -Seconds 3
          if (Test-Path -LiteralPath $env:INSTALL_DIR) {
            $leftovers = @(Get-ChildItem -LiteralPath $env:INSTALL_DIR -Force -ErrorAction SilentlyContinue)
            if ($leftovers.Count -gt 0) {
              throw "Uninstall left $($leftovers.Count) item(s) in $env:INSTALL_DIR"
            }
          }
          if (Test-Path -LiteralPath 'HKLM:\Software\ATK-Pro') {
            throw 'Uninstall left the HKLM product registry key.'
          }
          $uninstallKeys = @(
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8C7A9D5E-2A1B-3C4D-4E5E-8D3A2B1C4F9E}_is1',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{8C7A9D5E-2A1B-3C4D-4E5E-8D3A2B1C4F9E}_is1'
          )
          if ($uninstallKeys | Where-Object { Test-Path -LiteralPath $_ }) {
            throw 'Uninstall left an ATK-Pro uninstall registry entry.'
          }
          Write-Host 'Installer smoke passed: install, launch and uninstall completed cleanly.'

      - name: Emergency cleanup
        if: always()
        shell: pwsh
        run: |
          $installRoot = [IO.Path]::GetFullPath($env:INSTALL_DIR)
          Get-CimInstance Win32_Process -Filter "Name='ATK-Pro.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath).StartsWith($installRoot, [StringComparison]::OrdinalIgnoreCase) } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          $uninstaller = Join-Path $env:INSTALL_DIR 'unins000.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            try {
              $cleanupArgs = @(
                '/VERYSILENT'
                '/SUPPRESSMSGBOXES'
                '/NORESTART'
                "/LOG=`"$env:UNINSTALL_LOG`""
              )
              $cleanupProcess = Start-Process -FilePath $uninstaller -ArgumentList $cleanupArgs -Wait -PassThru
              if ($cleanupProcess.ExitCode -ne 0) {
                Write-Warning "Emergency uninstaller exited with code $($cleanupProcess.ExitCode)."
              }
            }
            catch {
              Write-Warning "Emergency cleanup failed: $_"
            }
          }

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-smoke-logs-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}\ATK-Pro-installer-smoke\install.log
            ${{ runner.temp }}\ATK-Pro-installer-smoke\uninstall.log
          if-no-files-found: ignore
          retention-days: 14

  smoke-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TARGET_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      EXPECTED_PORTABLE_SHA256: ${{ inputs.portable_sha256 }}

    steps:
      - name: Download, verify and inspect portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'ATK-Pro-portable-smoke'
          $extractRoot = Join-Path $smokeRoot 'extracted'
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null

          $assetName = "ATK-Pro-$($env:TARGET_TAG)-Windows-Portable.zip"
          $zipPath = Join-Path $smokeRoot $assetName
          if ($env:BUILD_RUN_ID) {
            $artifactDir = Join-Path $smokeRoot 'portable-artifact'
            gh run download $env:BUILD_RUN_ID `
              --repo $env:GITHUB_REPOSITORY `
              --name 'ATK-Pro-Windows-portable' `
              --dir $artifactDir
            if ($LASTEXITCODE -ne 0) { throw "Build artifact download failed" }
            Move-Item -LiteralPath (Join-Path $artifactDir $assetName) -Destination $zipPath
          }
          else {
            $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
            $release = $releases | Where-Object { $_.tag_name -eq $env:TARGET_TAG } | Select-Object -First 1
            if (-not $release) { throw "Release not found: $env:TARGET_TAG" }
            $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
            if (-not $asset) { throw "Release asset not found: $assetName" }
            curl.exe --location --fail-with-body --retry 3 --retry-all-errors `
              --header "Accept: application/octet-stream" `
              --header "Authorization: Bearer $env:GH_TOKEN" `
              --output $zipPath `
              $asset.url
            if ($LASTEXITCODE -ne 0) { throw "Asset download failed: $assetName" }
          }
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = $env:EXPECTED_PORTABLE_SHA256.Trim().ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Portable SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }

          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot
          $appRoot = Join-Path $extractRoot 'ATK-Pro'
          $app = Join-Path $appRoot 'ATK-Pro.exe'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "Missing portable executable: $app"
          }

          $languages = @(
            'it', 'en', 'es', 'pt', 'fr', 'de', 'nl', 'da', 'no', 'sv',
            'ro', 'pl', 'el', 'ru', 'tr', 'vi', 'zh', 'ja', 'ar', 'he'
          )
          foreach ($language in $languages) {
            $assetDir = Join-Path $appRoot "_internal/assets/$language"
            $localeDir = Join-Path $appRoot "_internal/locales/$language"
            if (-not (Test-Path -LiteralPath $assetDir -PathType Container)) {
              throw "Missing portable language assets: $language"
            }
            if (-not (Test-Path -LiteralPath $localeDir -PathType Container)) {
              throw "Missing portable locale: $language"
            }
          }

          @(
            "PORTABLE_EXE=$app"
            "PORTABLE_STDOUT=$(Join-Path $smokeRoot 'portable.stdout.log')"
            "PORTABLE_STDERR=$(Join-Path $smokeRoot 'portable.stderr.log')"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          Write-Host "Verified portable SHA-256 and $($languages.Count) languages/locales."

      - name: Launch portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QTWEBENGINE_DISABLE_SANDBOX = '1'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--no-sandbox'
          $process = Start-Process -FilePath $env:PORTABLE_EXE -PassThru -RedirectStandardOutput $env:PORTABLE_STDOUT -RedirectStandardError $env:PORTABLE_STDERR
          try {
            Start-Sleep -Seconds 20
            $process.Refresh()
            if ($process.HasExited) {
              $errorText = if (Test-Path -LiteralPath $env:PORTABLE_STDERR) {
                Get-Content -LiteralPath $env:PORTABLE_STDERR -Raw
              } else { '' }
              throw "Portable application exited early with code $($process.ExitCode): $errorText"
            }
            Write-Host "Portable application remained running for 20 seconds (PID $($process.Id))."
          }
          finally {
            $exePath = [IO.Path]::GetFullPath($env:PORTABLE_EXE)
            Get-CimInstance Win32_Process -Filter "Name='ATK-Pro.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ExecutablePath -and
                [IO.Path]::GetFullPath($_.ExecutablePath).Equals($exePath, [StringComparison]::OrdinalIgnoreCase)
              } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
            $remaining = Get-CimInstance Win32_Process -Filter "Name='ATK-Pro.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ExecutablePath -and
                [IO.Path]::GetFullPath($_.ExecutablePath).Equals($exePath, [StringComparison]::OrdinalIgnoreCase)
              }
            if ($remaining) {
              throw 'Portable smoke left an ATK-Pro process running.'
            }
          }

      - name: Emergency portable cleanup
        if: always()
        shell: pwsh
        run: |
          if ($env:PORTABLE_EXE) {
            $exePath = [IO.Path]::GetFullPath($env:PORTABLE_EXE)
            Get-CimInstance Win32_Process -Filter "Name='ATK-Pro.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ExecutablePath -and
                [IO.Path]::GetFullPath($_.ExecutablePath).Equals($exePath, [StringComparison]::OrdinalIgnoreCase)
              } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload portable logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-smoke-logs-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}\ATK-Pro-portable-smoke\portable.stdout.log
            ${{ runner.temp }}\ATK-Pro-portable-smoke\portable.stderr.log
          if-no-files-found: ignore
          retention-days: 14
