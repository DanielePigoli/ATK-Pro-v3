[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
markers =
    gui: tests that exercise GUI widgets or require Qt or pytest-qt support
    playwright: tests that exercise Playwright or browser fallback paths
    integration: tests that exercise multiple project components or end-to-end flows
    unit: tests that isolate a narrow component with mocks or local fixtures
    network: tests that require real external network access
